{% extends "base.html" %}

{% block content %}
<h1>Add Exercise Entry</h1>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<a href="{% url 'exercise_log' %}">Back to Exercise Log</a>
{% endblock %}
