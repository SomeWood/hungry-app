{% extends "base.html" %}

{% block content %}
<h1>Delete Exercise Entry</h1>

<p>Are you sure you want to delete "{{ exercise_entry.exercise_name }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes</button>
</form>

<a href="{% url 'exercise_log' %}">Cancel</a>
{% endblock %}
